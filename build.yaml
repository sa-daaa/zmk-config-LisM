# This file generates the GitHub Actions matrix.
# 構成: 左手 = 4way スティック（Peripheral） / 右手 = トラックボール（Central）
# 右手は DYA Studio（ZMK Studio 互換）対応。ブラウザからキーマップ等を変更できる
# 他の構成（non-trackball など）は git 履歴を参照
---
include:
  - board: xiao_ble//zmk
    shield: lism_left rgbled_adapter
    snippet: 4waystick-peripheral
    artifact-name: lism_left_peripheral_4waystick
  - board: xiao_ble//zmk
    shield: lism_right rgbled_adapter
    snippet: "studio-rpc-usb-uart trackball-central"
    artifact-name: lism_right_central_trackball
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
  # 切り分け用（一時的）: カーソルに DYA のカーソル処理を通さない版
  - board: xiao_ble//zmk
    shield: lism_right rgbled_adapter
    snippet: "studio-rpc-usb-uart trackball-central trackball-plain"
    artifact-name: lism_right_central_trackball_TEST_plain
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

  # Reset
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: settings_reset-seeeduino_xiao_ble-zmk
