parse_config:
  modifier_fn_map:
    left_gui: "Win"
    right_gui: "Win"

  raw_binding_map:
    # MOUSE レイヤーの独自ビヘイビア（キーを送ってレイヤー0に戻る）
    "&to_layer_0 A": "A"
    "&to_layer_0 B": "B"
    "&to_layer_0 C": "C"
    "&to_layer_0 D": "D"
    "&to_layer_0 E": "E"
    "&to_layer_0 F": "F"
    "&to_layer_0 G": "G"
    "&to_layer_0 H": "H"
    "&to_layer_0 I": "I"
    "&to_layer_0 J": "J"
    "&to_layer_0 K": "K"
    "&to_layer_0 L": "L"
    "&to_layer_0 M": "M"
    "&to_layer_0 N": "N"
    "&to_layer_0 O": "O"
    "&to_layer_0 P": "P"
    "&to_layer_0 Q": "Q"
    "&to_layer_0 R": "R"
    "&to_layer_0 S": "S"
    "&to_layer_0 T": "T"
    "&to_layer_0 U": "U"
    "&to_layer_0 V": "V"
    "&to_layer_0 W": "W"
    "&to_layer_0 X": "X"
    "&to_layer_0 Y": "Y"
    "&to_layer_0 Z": "Z"
    "&to_layer_0 TAB": "$$mdi:keyboard-tab$$"
    "&to_layer_0 SPACE": "$$mdi:keyboard-space$$"
    "&to_layer_0 BACKSPACE": "$$mdi:backspace$$"
    "&to_layer_0 DELETE": "$$mdi:backspace-reverse-outline$$"
    "&to_layer_0 ESCAPE": "$$mdi:keyboard-esc$$"
    "&to_layer_0 ENTER": "$$mdi:keyboard-return$$"
    "&to_layer_0 INT_MUHENKAN": "無変換"
    "&to_layer_0 INT_HENKAN": "変換"
    "&to_layer_0 UP": "↑"
    "&to_layer_0 DOWN": "↓"
    "&to_layer_0 LEFT": "←"
    "&to_layer_0 RIGHT": "→"
    "&to_layer_0 LC(V)": "Ctl+V"
    "&to_layer_0 LC(C)": "Ctl+C"
    "&to_layer_0 PERIOD": "."
    "&to_layer_0 COMMA": ","
    "&to_layer_0 SLASH": "/"
    "&to_layer_0 MINUS": "-"
    "&mkp_exit_AML LCLK": $$mdi:mouse-left-click-outline$$
    "&mkp_exit_AML MB1": $$mdi:mouse-left-click-outline$$
    "&mkp_exit_AML RCLK": $$mdi:mouse-right-click-outline$$
    "&mkp_exit_AML MB2": $$mdi:mouse-right-click-outline$$
    # タップ中だけそのレイヤーに切り替わるマクロ
    "&to_layer1": "KIGO"
    "&to_layer2": "NUM"
    "&to_layer3": "ARROW"
    # self behaviors
    "&kp RG(LEFT)":
      tap: $$mdi:page-previous-outline$$
    "&kp RG(RIGHT)":
      tap: $$mdi:page-next-outline$$
    "&kp LG(UP)":
      tap: $$mdi:format-vertical-align-top$$
    "&kp LG(DOWN)":
      tap: $$mdi:format-vertical-align-bottom$$
    "&kp RS(RC(TAB))":
      tap: $$mdi:skip-previous-outline$$
    "&kp RC(TAB)":
      tap: $$mdi:skip-next-outline$$
    # Mouse
    "&msc SCRL_UP":
      tap: $$mdi:pan-up$$
      hold: ''
      shifted: ''
    "&msc SCRL_DOWN":
      tap: $$mdi:pan-down$$
      hold: ''
      shifted: ''
    "&msc SCRL_LEFT":
      tap: $$mdi:pan-left$$
      hold: ''
      shifted: ''
    "&msc SCRL_RIGHT":
      tap: $$mdi:pan-right$$
      hold: ''
      shifted: ''
    "&mmv MOVE_LEFT":
      tap: $$mdi:menu-left$$
      hold: ''
      shifted: $$mdi:mouse$$
    "&mmv MOVE_RIGHT":
      tap: $$mdi:menu-right$$
      hold: ''
      shifted: $$mdi:mouse$$
    "&mmv MOVE_UP":
      tap: $$mdi:menu-up$$
      hold: ''
      shifted: $$mdi:mouse$$
    "&mmv MOVE_DOWN":
      tap: $$mdi:menu-down$$
      hold: ''
      shifted: $$mdi:mouse$$
    "&mkp LCLK":
      tap: $$mdi:mouse-left-click-outline$$
    "&mkp MB1":
      tap: $$mdi:mouse-left-click-outline$$
    "&mkp RCLK":
      tap: $$mdi:mouse-right-click-outline$$
    "&mkp MB2":
      tap: $$mdi:mouse-right-click-outline$$
    "&mkp MCLK":
      tap: $$mdi:mouse-scroll-wheel$$
    "&mkp MB3":
      tap: $$mdi:mouse-scroll-wheel$$
    # Modifiers
    "&caps_word": $$mdi:alpha-w-box$$

    # Empty
    # "&none":
    #   tap: $$mdi:minus-circle-outline$$
    #   type: none

    # Whitespace
    "&bkspc_del":
      type: backspace
      tap: $$mdi:backspace$$
      shifted: $$mdi:backspace-reverse-outline$$

    # Bluetooth（番号は ZMK / Keymap Editor と同じ 0 始まり: BT_SEL 1 → 1）
    "&bt BT_SEL 0":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 0
    "&bt BT_SEL 1":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 1
    "&bt BT_SEL 2":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 2
    "&bt BT_SEL 3":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 3
    "&bt BT_SEL 4":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 4
    "&out OUT_TOG":
      shifted: $$mdi:usb$$
      tap: $$mdi:toggle-switch$$
      hold: $$mdi:bluetooth$$
    "&bt BT_PRV":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: $$mdi:arrow-up-bold$$
    "&bt BT_NXT":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: $$mdi:arrow-down-bold$$
    # Reset
    "&sys_reset":
      type: bootloader
      tap: $$mdi:backup-restore$$
    "&bootloader":
      tap: $$mdi:progress-download$$

    "&studio_unlock":
      tap: $$mdi:lock-open-variant-outline$$


  zmk_keycode_map:
    # Symbols（OS 側が日本語キーボード=JIS 配列のときの実際の出力で表示）
    EXCLAMATION: "!"
    EXCL: "!"
    C_PLAY_PAUSE: "▷||"
    COMMA: ","
    DOT: "."
    PERIOD: "."
    QMARK: "?"
    QUESTION: "?"
    SLASH: "/"
    DELETE: "DEL"
    BACKSPACE: "BS"
    HASH: "#"
    DOLLAR: "$"
    PERCENT: "%"
    MINUS: "-"
    LEFT: "←"
    RIGHT: "→"
    UP: "↑"
    DOWN: "↓"
    # 矢印は文字で表示（記号アイコンだと Alt+← などの修飾キーが消えるため）
    LEFT_ARROW: "←"
    RIGHT_ARROW: "→"
    UP_ARROW: "↑"
    DOWN_ARROW: "↓"
    # JIS: Shift なし
    SEMICOLON: ";"
    SEMI: ";"
    SQT: ":"
    SINGLE_QUOTE: ":"
    APOSTROPHE: ":"
    APOS: ":"
    LEFT_BRACKET: "@"
    LBKT: "@"
    RIGHT_BRACKET: "["
    RBKT: "["
    NON_US_HASH: "]"
    NUHS: "]"
    BACKSLASH: "]"
    BSLH: "]"
    EQUAL: "^"
    GRAVE: "半/全"
    INT1: "\\"
    INTERNATIONAL_1: "\\"
    INT_RO: "\\"
    INT3: "¥"
    INTERNATIONAL_3: "¥"
    INT_YEN: "¥"
    # JIS: Shift あり
    LS(N2): "\""
    LSHFT(N2): "\""
    LS(NUMBER_2): "\""
    LSHFT(NUMBER_2): "\""
    LS(N6): "&"
    LSHFT(N6): "&"
    LS(NUMBER_6): "&"
    LSHFT(NUMBER_6): "&"
    LS(N7): "'"
    LSHFT(N7): "'"
    LS(NUMBER_7): "'"
    LSHFT(NUMBER_7): "'"
    LS(N8): "("
    LSHFT(N8): "("
    LS(NUMBER_8): "("
    LSHFT(NUMBER_8): "("
    LS(N9): ")"
    LSHFT(N9): ")"
    LS(NUMBER_9): ")"
    LSHFT(NUMBER_9): ")"
    LS(MINUS): "="
    LSHFT(MINUS): "="
    LS(EQUAL): "~"
    LSHFT(EQUAL): "~"
    LS(SEMICOLON): "+"
    LSHFT(SEMICOLON): "+"
    LS(SEMI): "+"
    LSHFT(SEMI): "+"
    LS(SQT): "*"
    LSHFT(SQT): "*"
    LS(SINGLE_QUOTE): "*"
    LSHFT(SINGLE_QUOTE): "*"
    LS(APOSTROPHE): "*"
    LSHFT(APOSTROPHE): "*"
    LS(APOS): "*"
    LSHFT(APOS): "*"
    LS(LEFT_BRACKET): "`"
    LSHFT(LEFT_BRACKET): "`"
    LS(LBKT): "`"
    LSHFT(LBKT): "`"
    LS(RIGHT_BRACKET): "{"
    LSHFT(RIGHT_BRACKET): "{"
    LS(RBKT): "{"
    LSHFT(RBKT): "{"
    LS(NON_US_HASH): "}"
    LSHFT(NON_US_HASH): "}"
    LS(NUHS): "}"
    LSHFT(NUHS): "}"
    LS(BACKSLASH): "}"
    LSHFT(BACKSLASH): "}"
    LS(BSLH): "}"
    LSHFT(BSLH): "}"
    LS(INT1): "_"
    LSHFT(INT1): "_"
    LS(INTERNATIONAL_1): "_"
    LSHFT(INTERNATIONAL_1): "_"
    LS(INT_RO): "_"
    LSHFT(INT_RO): "_"
    LS(INT3): "|"
    LSHFT(INT3): "|"
    LS(INTERNATIONAL_3): "|"
    LSHFT(INTERNATIONAL_3): "|"
    LS(INT_YEN): "|"
    LSHFT(INT_YEN): "|"
    # US 表記の記号キー: JIS では別の文字が出るので ⚠ 付きで実際の出力を表示
    AT_SIGN: "⚠\""
    AT: "⚠\""
    COLON: "⚠+"
    DOUBLE_QUOTES: "⚠*"
    DQT: "⚠*"
    AMPERSAND: "⚠'"
    AMPS: "⚠'"
    ASTERISK: "⚠("
    STAR: "⚠("
    LEFT_PARENTHESIS: "⚠)"
    LPAR: "⚠)"
    RIGHT_PARENTHESIS: "⚠(なし)"
    RPAR: "⚠(なし)"
    TILDE: "⚠(なし)"
    PLUS: "⚠~"
    UNDERSCORE: "⚠="
    UNDER: "⚠="
    CARET: "⚠&"
    PIPE: "⚠}"
    LEFT_BRACE: "⚠`"
    LBRC: "⚠`"
    RIGHT_BRACE: "⚠{"
    RBRC: "⚠{"

    # Modifiers
    LCTRL: "Ctrl"
    LEFT_CONTROL: "Ctrl"
    LALT: "Alt"
    LEFT_ALT: "Alt"
    LSHIFT: $$mdi:apple-keyboard-shift$$
    LEFT_SHIFT: $$mdi:apple-keyboard-shift$$
    LSHFT: $$mdi:apple-keyboard-shift$$
    LCMD: "Win"
    LGUI: "Win"
    #LG: $$mdi:apple-keyboard-command$$
    LEFT_GUI: "Win"
    LEFT_COMMAND: "Win"
    RCTRL: "Ctrl"
    RIGHT_CONTROL: "Ctrl"
    RALT: "Alt"
    RIGHT_ALT: "Alt"
    RSHIFT: $$mdi:apple-keyboard-shift$$
    RIGHT_SHIFT: $$mdi:apple-keyboard-shift$$
    RSHFT: $$mdi:apple-keyboard-shift$$
    RCMD: "Win"
    RGUI: "Win"
    #RG: $$mdi:apple-keyboard-command$$
    PSCRN: $$mdi:printer-outline$$
    PRINTSCREEN: $$mdi:printer-outline$$
    # 日本語キー（短く表示）
    INT_HENKAN: "変換"
    INT_MUHENKAN: "無変換"
    INT_KATAKANAHIRAGANA: "かな"
    LANG1: "かな"
    LANG2: "英数"
    RIGHT_COMMAND: "Win"
    PAGE_UP:
      tap: 'PgUp'
      shifted: ''
    PAGE_DOWN:
      tap: 'PgDn'
      shifted: ''
    INSERT:
       tap: 'Ins'
       shifted: ''
    # "Meh" key
    LS(LC(LALT)): $$mdi:star-three-points$$


    # Whitespace
    ENTER:
      type: enter
      tap: $$mdi:keyboard-return$$
    RET:
      type: enter
      tap: $$mdi:keyboard-return$$
    ESC: $$mdi:keyboard-esc$$
    ESCAPE: $$mdi:keyboard-esc$$
    TAB: $$mdi:keyboard-tab$$
    LS(TAB): $$mdi:keyboard-tab-reverse$$
    # 修飾キー付き Tab（アイコンだと修飾キーが消えるため文字で表示）
    LC(TAB): "Ctl+Tab"
    LC(LS(TAB)): "Ctl+Sft+Tab"
    LS(LC(TAB)): "Ctl+Sft+Tab"
    LA(TAB): "Alt+Tab"
    LG(TAB): "Win+Tab"
    SPACE: $$mdi:keyboard-space$$
    BACKSPACE:
      type: backspace
      tap: $$mdi:backspace$$
    BSPC:
      type: backspace
      tap: $$mdi:backspace$$
    DELETE: $$mdi:backspace-reverse-outline$$
    DEL: $$mdi:backspace-reverse-outline$$

    # Locks
    CAPSLOCK: $$mdi:apple-keyboard-caps$$
    CAPS: $$mdi:apple-keyboard-caps$$

draw_config:
  dark_mode: auto
  glyph_tap_size: 18
  footer_text: 'LisM KEYMAPS | Created with keymap-drawer' 

  # 文字の重なり対策
  key_h: 64                       # キーを大きく（既定 56）
  shrink_wide_legends: 5          # 5文字を超える表記は縮小
  separate_combo_diagrams: true   # コンボはキーの上に重ねず、レイヤーの下に別図で表示
  combo_diagrams_scale: 2
